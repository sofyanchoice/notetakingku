<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catatan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vditor@3.9.7/dist/index.css" />
<link rel="stylesheet" href="styles.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/vditor@3.9.7/dist/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
</head>
<body>

<!-- GATE (LOGIN) -->
<div id="gate" class="gate">
  <div class="gate-card">
    <div class="gate-mark">C</div>
    <h1 class="gate-title">CATATAN</h1>
    <p class="gate-sub">Notebook, bagian, dan catatan bergaya OneNote — ditulis pakai markdown, tersimpan di Google Drive-mu sendiri.</p>
    <button id="signin-btn" class="btn-brut btn-yellow btn-block">MASUK DENGAN GOOGLE</button>
    <div id="gate-status" class="gate-note"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="app hidden">
  <!-- KOLOM 1: NOTEBOOKS -->
  <div id="col-notebooks" class="col col-notebooks mobile-show">
    <div class="col-head">
      <div class="brand">
        <div class="brand-mark">C</div>
        <div class="brand-name">CATATAN</div>
      </div>
    </div>
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Cari catatan...">
      <button id="search-clear" class="search-clear hidden">×</button>
    </div>
    <div class="col-section-label">
      <span>NOTEBOOK</span>
      <button id="btn-new-notebook" class="mini-add" title="Notebook baru">+</button>
    </div>
    <ul id="notebook-list" class="notebook-list"></ul>
    <div class="col-foot">
      <div class="user-email" id="user-email"></div>
      <div class="sync-pill" id="sync-pill">
        <span class="sync-dot"></span>
        <span id="sync-label">sync</span>
      </div>
      <button id="signout-btn" class="link-btn">Keluar</button>
    </div>
  </div>

  <!-- RESIZE HANDLE -->
  <div class="resize-handle" id="resize-handle"></div>

  <!-- KOLOM 2: SECTIONS + PAGES -->
  <div id="col-pages" class="col col-pages">
    <div class="col-head with-back">
      <button id="btn-back-to-notebooks" class="btn-brut btn-back only-mobile">←</button>
      <h2 id="notebook-title" class="col-title">—</h2>
    </div>
    
    <div class="section-actions">
      <button id="btn-new-section" class="mini-add-row">+ BAGIAN BARU</button>
      <button id="btn-new-page" class="mini-add-row">+ CATATAN BARU</button>
    </div>

    <div id="page-list" class="page-list"></div>
    <div id="pages-empty" class="empty-note hidden">Belum ada catatan di bagian ini.</div>
  </div>

  <!-- KOLOM 3: EDITOR -->
  <div id="col-editor" class="col col-editor">
    <div class="col-head with-back">
      <button id="btn-back-to-pages" class="btn-brut btn-back only-mobile">←</button>
      <input type="text" id="edit-title" class="edit-title" placeholder="Judul catatan...">
      <button id="btn-delete-note" class="btn-brut btn-del btn-red only-mobile">🗑</button>
    </div>
    <div id="meta-row" class="meta-row hidden">
      <button id="tb-task" class="chip-toggle">✓ TUGAS</button>
      <input type="date" id="edit-due" class="chip-date hidden">
      <input type="text" id="edit-category" class="chip-cat" placeholder="Kategori (pisahkan koma)">
    </div>
    <div id="editor-empty" class="empty-note">Pilih atau buat catatan untuk mulai menulis.</div>
    <div id="vditor-container" class="vditor-container hidden"></div>
    <div class="editor-footer">
      <span id="edit-savestate" class="save-state"></span>
    </div>
  </div>
</div>

<!-- CUSTOM MODAL -->
<div id="custom-modal" class="modal-overlay hidden">
  <div class="modal-box">
    <h3 id="modal-title">Konfirmasi</h3>
    <p id="modal-message">Apakah Anda yakin?</p>
    <input type="text" id="modal-input" class="hidden" placeholder="Masukkan nama...">
    <div class="modal-actions">
      <button id="modal-cancel" class="btn-brut">Batal</button>
      <button id="modal-confirm" class="btn-brut btn-red">OK</button>
    </div>
  </div>
</div>

<!-- CONTEXT MENU -->
<div id="context-menu" class="context-menu hidden"></div>

<script src="app.js"></script>
</body>
</html>
